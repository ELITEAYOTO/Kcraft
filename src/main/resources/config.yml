# =============================================================
# KCraft V2.1 — Foundation / Volkaria
# =============================================================
# V2 utilise un schema strict. Les anciens namespaces et les anciennes
# options de pseudo-cache ont volontairement été retirés.

schema_version: 2

Kcraft:
  settings:
    prefix: "&8[&6Kcraft&8]"
    debug-level: 1
    enabled-worlds:
      - "world"
      - "world_nether"
      - "world_faction"
    ops-bypass-permissions: true

  # En V2.1 il n'existe PLUS de cache-popular-crafts/smart-cache-size.
  # Le vrai RecipeIndex + MatrixFingerprint arrivera en V2.2/V2.3.
  performance:
    async-logging: true

  restrictions:
    blocked-vanilla-craft-results:
      - TRAPPED_CHEST
    clean-generated-container-loot: true
    blocked-generated-loot:
      - TRAPPED_CHEST

  effects:
    particles:
      enabled: false
      allow-per-craft: true
    sounds:
      enabled: true
      allow-per-craft: true

  gui:
    use-borders: true
    border-color: "GRAY"
    border-item: "STAINED_GLASS_PANE"
    title-prefix: "&8"
    glass-colors:
      craft-area: "GREEN"
      result-area: "YELLOW"
      button-area: "BLUE"

  hooks:
    # false = comportement tolerant si Kfaction n'est pas présent.
    # true = toute recette faction-level-required est refusée sans Kfaction.
    strict-faction-level: false

  logging:
    enabled: true
    file: "crafts-history.json"
    log-per-player: true
    log-faction-stats: true
    rotation: "DAILY"
    keep-days: 30

  # Tables physiques: uniquement 3x3 / 4x4 / 5x5 en V2.
  custom-blocks:
    tier1:
      block: "PISTON"
      size: "4x4"
      permission: "kcraft.table.use"
      name: "&6&lTable Antique"

  # Tables virtuelles: uniquement 3x3 / 4x4 / 5x5 en V2.
  command-tables:
    npc_table:
      command: "kcraft-npc-table"
      size: "5x5"
      name: "&8Table du Forgeron"
      only-console-npc: true

    admin_table:
      command: "kcraftadmin"
      size: "5x5"
      name: "&8Table Admin"
      permission: "kcraft.admin.table"

  optimizations:
    batch-craft:
      enabled: true
      # Garde-fou V2.1. Le planner batch optimisé arrive en V2.4.
      max-batch: 64
