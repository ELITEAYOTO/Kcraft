    permission: "kcraft.collector.iron"
    worlds: ["world"]

    pattern:
      - "GGG"
      - "GHG"
      - "GGG"
    ingredients:
      G:
        material: "GOLD_INGOT"
      H:
        material: "HOPPER"

    result:
      material: "TRAPPED_CHEST"
      name: "&6Collecteur Iron (Preview)"
      lore:
