# ===============================================
#         KCRAFT - Collecteurs Kharvester  
#    Intégration avec le plugin Kharvester
# ===============================================

collectors:
  # COLLECTEUR KHARVESTER - Stone (preview + give commande)
  kharvester_collector_stone:
    type: "SHAPED"
    table: "tier1"
    enabled-if-plugin: "Kharvester"
    success-rate: 100
    permission: "kcraft.collector.stone"
    worlds: ["world"]
    
    pattern:
      - "III"
      - "IHI"  
      - "III"
    ingredients:
      I:
        material: "IRON_INGOT"
        # Pas de NBT - accepte lingots vanilla
      H:
        material: "HOPPER"
        
    result:
      # Preview dans la GUI Kcraft (le vrai item est donné par commande)
      material: "CHEST"
      name: "&2Collecteur Stone (Preview)"
      lore:
        - "&7Preview Kcraft"
        - "&7L'item final est donné par Kharvester"
      
    on-success:
      message: "&a✓ Collecteur Tier I obtenu !"
      sound: "BLOCK_ANVIL_USE"
      particle: "CRIT:15"
      # Commande Kharvester (observée dans le workspace): khgive
      command: "khgive {player_name} collector_stone 1"
      consume-result: false
      console-command: true

  # COLLECTEUR KHARVESTER - Iron (preview + give commande)
