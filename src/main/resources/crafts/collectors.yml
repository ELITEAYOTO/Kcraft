        - "&7L'item final est donné par Kharvester"

    on-success:
      message: "&a✓ Collecteur Tier II obtenu !"
      sound: "BLOCK_ANVIL_USE"
      particle: "CRIT:20"
      # Commande Kharvester (observée dans le workspace): khgive
      command: "khgive {player_name} collector_iron 1"
