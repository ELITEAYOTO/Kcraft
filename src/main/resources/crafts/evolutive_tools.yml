      P:
        material: "MELON"
        nbt:
          sparrowmc-item: "watermelon_t3"
      C:
        material: "PUMPKIN"
        nbt:
          sparrowmc-item: "pumpkin_t3"
      A:
        material: "INK_SACK"
        data: 3  # Cacao
        nbt:
          sparrowmc-item: "cocoa_t3"
      B:
        material: "STICK"
        nbt:
          sparrowmc-item: "azurite_stick"
    result:
      material: "DIAMOND_AXE"
      amount: 1
      name: "&6&lHache Évolutive &7[Niveau 1]"
      enchanted: true
      nbt:
        kcraft-preview-item: "FarmAxe1"
        sparrowmc-item: "evo_axe_preview"
        level: 1
        xp: 0
      lore:
        - "&7Hache qui évolue en coupant du bois"
