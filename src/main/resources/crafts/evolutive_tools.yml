# ===============================================
#        KCRAFT - Outils Évolutifs Integration  
#      Crafts pour le plugin OutilsEvolutif
# ===============================================

evolutive_tools:
  # ================== HOUE ÉVOLUTIVE ==================
  
  evolutive_hoe:
    type: "SHAPED"
    table: "tier1"
    enabled-if-plugin: "OutilsEvolutif"
    success-rate: 75
    faction-level-required: 5
    pattern:
      - "VPC"
      - " B "
      - " B "
    ingredients:
      V:
        material: "NETHER_STALK"
        nbt:
          sparrowmc-item: "nether_wart_t3"
      P:
        material: "POTATO_ITEM"
        nbt:
          sparrowmc-item: "potato_t3"
      C:
        material: "CARROT_ITEM"
        nbt:
          sparrowmc-item: "carrot_t3"
      B:
        material: "STICK"
        nbt:
          sparrowmc-item: "azurite_stick"
    result:
      # Preview: Houe avec le CIT du plugin OutilsEvolutif
      material: "DIAMOND_HOE"
      amount: 1
      name: "&a&lHoue Évolutive &7[Niveau 1]"
      enchanted: true
      nbt:
        # NBT temporaire pour la preview - sera remplacé par l'outil réel
        kcraft-preview-item: "Houe1_Sparrowmc"
        sparrowmc-item: "evo_hoe_preview"
        level: 1
        xp: 0
      lore:
        - "&7Houe qui évolue avec l'usage"
        - "&aNiveau: &f1 &7(0 XP)"
        - "&bCapacité: &f3x3 &7farming"
        - ""
        - "&eÉvolue en farmant des cultures"
        - "&8Plugin: OutilsEvolutif"
        
    # Action spéciale: donner l'outil via commande
    on-success:
      message: "&a✓ Houe évolutive craftée!"
      sound: "ENTITY_PLAYER_LEVELUP"
      particle: "VILLAGER_HAPPY:20"
      command: "giveoutil hoe 1"
      console-command: false
      consume-result: false
      
  # ================== HACHE ÉVOLUTIVE ==================
  
